<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users - PyQuiz Admin</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
  </head>
  <body class="pq-with-sidebar admin-page">
    <!-- admin-shell:start -->
    <a class="admin-skip" href="#main-content">Skip to content</a>
    <div class="pq-app-topbar">
      <button id="sidebar-toggle" class="pq-drawer-toggle" type="button" aria-expanded="false" aria-controls="pq-sidebar" aria-label="Open navigation menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
      </button>
      <a href="/admin_dashboard.html" class="pq-app-topbar__logo">
        <img src="/images/pyquiz-wordmark.png" alt="PyQuiz admin" class="pq-wordmark" width="111" height="20" />
      </a>
      <span class="pq-app-topbar__title">Admin</span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
      </button>
    </div>
    <div class="pq-drawer-overlay" id="sidebar-overlay" hidden></div>
    <aside class="pq-side" id="pq-sidebar" aria-label="Admin navigation">
      <div class="pq-side__brand">
        <a href="/admin_dashboard.html" class="pq-side__logo">
          <img src="/images/pyquiz-wordmark.png" alt="PyQuiz admin" class="pq-wordmark" width="133" height="24" />
        </a>
        <span class="badge badge-brand admin-side__tag">Admin</span>
        <button id="sidebar-close" class="pq-drawer-close" type="button" aria-label="Close navigation menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <nav aria-label="Admin" class="pq-side__nav">
        <a class="pq-sidelink" href="/admin_dashboard.html" data-page="admin_dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>Add a question</span>
        </a>
        <a class="pq-sidelink" href="/manage-questions.html" data-page="manage-questions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" /></svg>
          <span>Questions</span>
        </a>
        <a class="pq-sidelink" href="/users.html" data-page="users.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6" /></svg>
          <span>Users</span>
        </a>
        <a class="pq-sidelink" href="/contacts.html" data-page="contacts.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 5h18v14H3z" /><path d="m3 6 9 7 9-7" /></svg>
          <span>Messages</span>
        </a>
      </nav>
      <div class="pq-side__account">
        <a class="pq-side__identity" href="/index.html">
          <span class="pq-side__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" /></svg>
          </span>
          <span>View the site</span>
        </a>
        <button id="logout-btn" class="secondary-btn pq-side__logout" type="button">Log out</button>
      </div>
    </aside>
    <!-- admin-shell:end -->

    <main id="main-content" class="admin-main admin-main--wide" tabindex="-1">
      <header class="pq-page-head">
        <div>
          <h1>Users</h1>
          <p class="pq-muted">Accounts, their progress, and banning or unbanning an account.</p>
        </div>
      </header>

      <p id="list-status" class="admin-status" role="status"></p>

      <section id="user-list-section" class="card admin-table-card">
        <div class="admin-table-wrap">
          <table id="user-table" class="pq-table admin-table">
            <thead>
              <tr>
                <th scope="col">Username</th>
                <th scope="col">Email</th>
                <th scope="col">Role</th>
                <th scope="col">Points</th>
                <th scope="col">Answered</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="pq-sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="user-list-body">
              <tr><td colspan="7">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination-controls" class="admin-pager">
          <button type="button" id="prev-page-btn" class="secondary-btn">Previous</button>
          <span id="page-label">Page 1</span>
          <button type="button" id="next-page-btn" class="secondary-btn">Next</button>
        </div>
      </section>
    </main>

    <script type="module" src="/js/admin_shell.js"></script>
    <script type="module" src="js/users.js"></script>
  </body>
</html>
