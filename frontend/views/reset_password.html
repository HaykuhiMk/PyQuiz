<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/public.css" />
    <link rel="stylesheet" href="/css/reset_password.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main class="pq-auth">
      <div id="reset-password-container" class="pq-auth__card">
        <div class="pq-auth__head">
          <h1 id="reset-title">Reset your password</h1>
          <p class="pq-muted">Choose a new password for your account.</p>
        </div>

        <form id="resetPasswordForm" class="pq-form" method="post" aria-labelledby="reset-title" aria-describedby="helper-text">
          <div class="pq-field">
            <label for="password">New password</label>
            <div class="pq-password">
              <input class="pq-input" type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="reset-password-help" />
              <button type="button" id="toggle-password" class="pq-password__toggle pq-iconbtn" aria-pressed="false" aria-controls="password">Show</button>
            </div>
            <span class="pq-help" id="reset-password-help">At least 8 characters, with an uppercase letter, a lowercase letter, a number and one of @ $ ! % * ? &amp; _</span>
          </div>

          <div class="pq-field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="pq-password">
              <input class="pq-input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
              <button type="button" id="toggle-confirm-password" class="pq-password__toggle pq-iconbtn" aria-pressed="false" aria-controls="confirmPassword">Show</button>
            </div>
          </div>

          <p id="helper-text" class="pq-form-message pq-status" role="alert"></p>

          <button type="submit" class="primary-btn pq-form__submit">Reset password</button>
        </form>

        <p class="pq-auth__alt">Remembered it? <a href="/login.html">Back to log in</a></p>
      </div>
    </main>
    <div id="footer-container"></div>
    <script type="module" src="/js/load_header_footer.js"></script>
    <script type="module" src="/js/reset_password.js"></script>
  </body>
</html>
