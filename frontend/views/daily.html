<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Challenge - PyQuiz</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/header_footer.css" />
  <link rel="stylesheet" href="/css/quiz-page.css" />
  <link rel="stylesheet" href="/css/daily.css" />
</head>
<body class="pq-with-sidebar" data-page-title="Daily Challenge">
  <div id="header-container"></div>
  <main class="page-shell daily-page reveal">
    <div class="pq-page-head">
      <div>
        <h1 class="pq-display">Daily challenge</h1>
        <p class="pq-body-lg pq-muted">The same questions for everyone today, with bonus points for each correct answer.</p>
      </div>
      <span class="badge" id="daily-date" hidden></span>
      <span class="badge" id="daily-reset" hidden></span>
    </div>

    <div id="daily-status" role="status" aria-live="polite"></div>
    <section id="daily-quiz" class="daily-quiz" aria-labelledby="daily-question-title" hidden></section>
    <section id="daily-result" class="card daily-result" aria-live="polite" hidden></section>
  </main>
  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.24.1/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.24.1/components/prism-python.min.js"></script>
  <script type="module" src="/js/daily.js"></script>
  <script type="module" src="/js/load_sidebar.js"></script>
</body>
</html>
