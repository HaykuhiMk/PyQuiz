<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/public.css" />
    <link rel="stylesheet" href="/css/registration_styles.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main class="pq-auth">
      <div id="registration-container" class="pq-auth__card pq-auth__card--wide">
        <div class="pq-auth__head">
          <h1 id="registration-title">Create your account</h1>
          <p class="pq-muted">Save your progress, keep a streak and appear on the leaderboard. All fields are required.</p>
        </div>

        <form id="registration-form" class="pq-form" method="post" aria-labelledby="registration-title" aria-describedby="helper-text">
          <div class="pq-field input-container">
            <label for="username">Username</label>
            <input class="pq-input" type="text" id="username" name="username" autocomplete="username" required />
          </div>

          <div class="pq-field input-container">
            <label for="email">Email</label>
            <input class="pq-input" type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="pq-field">
            <label for="password">Password</label>
            <div class="pq-password">
              <input class="pq-input" type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="password-help" />
              <button type="button" id="toggle-password" class="pq-password__toggle pq-iconbtn" aria-pressed="false" aria-controls="password">Show</button>
            </div>
            <span class="pq-help" id="password-help">At least 8 characters, with an uppercase letter, a lowercase letter, a number and one of @ $ ! % * ? &amp; _</span>
          </div>

          <div class="pq-field">
            <label for="repeat-password">Repeat password</label>
            <div class="pq-password">
              <input class="pq-input" type="password" id="repeat-password" name="repeat-password" autocomplete="new-password" required />
              <button type="button" id="toggle-repeat-password" class="pq-password__toggle pq-iconbtn" aria-pressed="false" aria-controls="repeat-password">Show</button>
            </div>
          </div>

          <p id="helper-text" class="pq-form-message pq-status" role="alert"></p>

          <button type="submit" class="primary-btn pq-form__submit">Create account</button>
        </form>

        <p class="pq-auth__alt">Already have an account? <a href="/login.html">Log in</a></p>
      </div>
    </main>
    <div id="footer-container"></div>

    <script type="module" src="/js/register.js"></script>
    <script type="module" src="/js/load_header_footer.js"></script>
  </body>
</html>
