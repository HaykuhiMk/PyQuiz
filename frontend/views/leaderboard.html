<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - PyQuiz</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/header_footer.css" />
  <link rel="stylesheet" href="/css/leaderboard.css" />
</head>
<body class="pq-with-sidebar" data-page-title="Leaderboard">
  <div id="header-container"></div>
  <main class="page-shell reveal">
    <div class="pq-page-head">
      <div>
        <h1 class="pq-display">Leaderboard</h1>
        <p class="pq-body-lg pq-muted">Players ranked by total points, then by best streak.</p>
      </div>
      <span class="badge" id="leaderboard-count" hidden></span>
    </div>

    <div id="leaderboard-feedback" role="status" aria-live="polite"></div>
    <div class="leaderboard-card" id="leaderboard-list" aria-busy="true"></div>
  </main>
  <div id="footer-container"></div>
  <script type="module" src="/js/leaderboard.js"></script>
  <script type="module" src="/js/load_sidebar.js"></script>
</body>
</html>
