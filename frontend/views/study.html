<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Mode - PyQuiz</title>
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/header_footer.css" />
  <link rel="stylesheet" href="/css/study.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PrismJS/prism-themes/themes/prism-one-dark.css" />
</head>
<body class="pq-with-sidebar" data-page-title="Study">
  <div id="header-container"></div>
  <main class="page-shell reveal">
    <h1 class="page-title">Study Mode</h1>
    <p class="page-subtitle">Learn at your own pace with instant answers and explanations.</p>

    <div class="card filters">
      <input type="search" id="study-search" placeholder="Search topics..." />
      <select id="study-difficulty" aria-label="Difficulty filter">
        <option value="">All difficulties</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button class="primary-btn" id="study-load-btn" type="button">Load Cards</button>
    </div>

    <div id="study-cards" class="study-grid"></div>
    <div class="pager btn-row btn-row--center">
      <button class="secondary-btn" id="study-prev" type="button">Previous</button>
      <span id="study-page-label" class="pager-label">Page 1</span>
      <button class="secondary-btn" id="study-next" type="button">Next</button>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.24.1/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.24.1/components/prism-python.min.js"></script>
  <script type="module" src="/js/study.js"></script>
  <script type="module" src="/js/load_sidebar.js"></script>
</body>
</html>
