<!DOCTYPE html>
<html lang="en">
  <head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/contact.css" />
  </head>
  <body>
    <div id="header-container"></div>

    <section id="contact">
      <div class="contact-content">
        <h1>Contact Us</h1>
        <p>
          If you have any questions or need assistance, feel free to reach out
          to us through the form below!
        </p>

        <form id="contact-form" action="#" method="POST">
          <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <div style="position: absolute; left: -9999px" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <button type="submit" id="submit-btn" class="primary-btn">Send Message</button>
        </form>
      </div>
    </section>

    <div id="footer-container"></div>

    <script type="module" src="/js/contact.js"></script>
    <script type="module" src="/js/load_header_footer.js"></script>
  </body>
</html>
