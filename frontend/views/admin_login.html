<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin sign-in - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/public.css" />
    <link rel="stylesheet" href="/css/admin_login.css" />
  </head>
  <body class="admin-login-page">
    <main class="pq-auth">
      <section id="login-section" class="pq-auth__card" aria-labelledby="admin-login-title">
        <div class="pq-auth__head">
          <div class="admin-login__brand">
            <img src="/images/pyquiz-wordmark.png" alt="PyQuiz" class="pq-wordmark" width="133" height="24" />
            <span class="badge badge-brand">Admin</span>
          </div>
          <h1 id="admin-login-title">Admin sign-in</h1>
          <p class="pq-muted">For managing questions, users and messages.</p>
        </div>
        <form id="admin-login-form" class="pq-form" aria-labelledby="admin-login-title" aria-describedby="login-error">
          <div class="pq-field">
            <label for="admin-username">Username</label>
            <input class="pq-input" type="text" id="admin-username" autocomplete="username" aria-describedby="admin-username-help" autofocus required />
            <p class="pq-help" id="admin-username-help">Your PyQuiz username, not your email address.</p>
          </div>
          <div class="pq-field">
            <label for="admin-password">Password</label>
            <div class="pq-password">
              <input class="pq-input" type="password" id="admin-password" autocomplete="current-password" required />
              <button type="button" id="toggle-admin-password" class="pq-password__toggle pq-iconbtn" aria-pressed="false" aria-controls="admin-password">Show</button>
            </div>
            <p class="pq-help admin-capslock" id="caps-lock-note" hidden>Caps Lock is on.</p>
          </div>
          <p id="login-error" class="pq-form-message pq-status error-message" role="alert"></p>
          <button type="submit" class="primary-btn pq-form__submit">Sign in</button>
        </form>
        <p class="pq-auth__alt"><a href="/index.html">Back to PyQuiz</a></p>
      </section>
    </main>

    <script type="module" src="/js/admin_login.js"></script>
  </body>
</html>
