<!DOCTYPE html>
<html lang="en">
  <head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/forgot_password_styles.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <div id="forgot-password-container">
      <h2>Forgot Your Password?</h2>
      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your Email"
          required
        /><br /><br />
        <button type="submit" class="primary-btn">Send Reset Link</button>
      </form>
      <div id="helper-text"></div>
    </div>
    <div id="footer-container"></div>
    <script type="module" src="/js/forgot_password.js"></script>
    <script type="module" src="/js/load_header_footer.js"></script>
  </body>
</html>
