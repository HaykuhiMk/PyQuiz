<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/public.css" />
    <link rel="stylesheet" href="/css/forgot_password_styles.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main class="pq-auth">
      <div id="forgot-password-container" class="pq-auth__card">
        <div class="pq-auth__head">
          <h1 id="forgot-title">Forgot your password?</h1>
          <p class="pq-muted">Enter the email address you signed up with and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgot-password-form" class="pq-form" aria-labelledby="forgot-title" aria-describedby="helper-text" novalidate>
          <div class="pq-field">
            <label for="email">Email</label>
            <input class="pq-input" type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <p id="helper-text" class="pq-form-message pq-status" role="alert"></p>

          <button type="submit" class="primary-btn pq-form__submit">Send reset link</button>
        </form>

        <p class="pq-auth__alt">Remembered it? <a href="/login.html">Back to log in</a></p>
      </div>
    </main>
    <div id="footer-container"></div>
    <script type="module" src="/js/forgot_password.js"></script>
    <script type="module" src="/js/load_header_footer.js"></script>
  </body>
</html>
