<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem('pyquiz-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyQuiz Admin</title>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("adminToken");
            if (token) {
                window.location.href = "admin_dashboard.html"; 
            } else {
                window.location.href = "admin_login.html";
            }
        });
    </script>
</head>
<body>
</body>
</html>
