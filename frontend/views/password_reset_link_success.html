<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="/js/theme-init.js"></script>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Your Email - PyQuiz</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/header_footer.css" />
    <link rel="stylesheet" href="/css/public.css" />
  </head>
  <body>
    <div id="header-container"></div>
    <main class="pq-auth">
      <div id="password-reset-success-container" class="pq-auth__card">
        <div class="pq-auth__head">
          <h1>Check your email</h1>
        </div>
        <div class="pq-banner pq-banner--sun">
          <span class="pq-disc-mark" aria-hidden="true"></span>
          <span class="pq-banner__text">Your password reset link has been sent to your email.</span>
        </div>
        <p class="pq-muted pq-auth__body">
          You can now safely close this page and open the link in your email to complete the password reset process.
        </p>
        <p class="pq-muted pq-auth__body">
          If you don't see the email in your inbox, please check your spam folder.
        </p>
        <p class="pq-auth__alt"><a href="/login.html">Back to log in</a></p>
      </div>
    </main>
    <div id="footer-container"></div>
    <script type="module" src="/js/load_header_footer.js"></script>
  </body>
</html>
